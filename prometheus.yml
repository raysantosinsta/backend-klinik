global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'nestjs-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:3001']

  - job_name: 'python-ai-agent'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8000']
